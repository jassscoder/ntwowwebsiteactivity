<!DOCTYPE html>

<head>

    <title>CLASH OF CLANS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 4px;
            background: url("../assets/cocwebbg.jpg") center / cover fixed;
        }

        table {
            width: min(480px, 100%);
            margin: auto;
            border: 3px solid #111;
            border-collapse: collapse;
            table-layout: fixed;
            background: #111;
        }

        th,
        td {
            height: min(170px, 21.25vw);
            padding: 0;
            border: 2px solid #111;
            overflow: hidden;
            background: #111;
        }

        caption {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        th {
            height: min(72px, 9vw);
        }

        img {
            width: 100%;
            height: 100%;
            display: block;
            border: 1px solid #626262;
            object-fit: cover;
        }

        a {
            display: block;
            width: 100%;
            height: 100%;
        }

        .large {
            position: relative;
            height: min(340px, 42.5vw);
            vertical-align: top;
        }

        .large img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .large-caption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 12px 10px;
            color: white;
            text-align: center;
            font-family: Georgia, serif;
            font-size: 13px;
            line-height: 1.35;
        }

        .large-caption strong {
            display: block;
            color: #f7d77b;
            font-size: 18px;
        }

        .large-caption small {
            display: block;
            margin-top: 3px;
            color: #eeeeee;
        }

        .image-caption {
            position: relative;
            margin-top: -32px;
            padding: 7px 3px;
            color: #f7d77b;
            text-align: center;
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 13px;
        }

        .inside-box,
        .image8-box {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 4px;
            background: #111;
        }

        .inside-box {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            padding: 4px;
        }

        .image8-box {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 4px;
        }

        .inside-box div,
        .image8-box div {
            min-width: 0;
            min-height: 0;
        }

        .box3 {
            grid-column: 3 / 5;
            grid-row: 1 / 3;
        }

        .box10 {
            grid-column: 1 / 3;
            grid-row: 4 / 6;
        }

    </style>
